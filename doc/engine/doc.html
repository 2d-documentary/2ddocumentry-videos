<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Bebas; src: url(../fonts/BebasNeue-Regular.ttf); }
@font-face { font-family: Playfair; font-weight: 400 900; src: url(../fonts/PlayfairDisplay-VF.ttf); }

@font-face { font-family: SpecialElite; src: url(../fonts/SpecialElite-Regular.ttf); }
@font-face { font-family: Caveat; font-weight: 400 700; src: url(../fonts/Caveat-VF.ttf); }
@font-face { font-family: Oswald; font-weight: 200 700; src: url(../fonts/Oswald-VF.ttf); }
@font-face { font-family: CourierPrime; src: url(../fonts/CourierPrime-Regular.ttf); }
@font-face { font-family: Anton; src: url(../fonts/Anton-Regular.ttf); }
@font-face { font-family: ArchivoBlack; src: url(../fonts/ArchivoBlack-Regular.ttf); }
@font-face { font-family: Montserrat; font-weight: 100 900; src: url(../fonts/Montserrat-VF.ttf); }
@font-face { font-family: Inter; font-weight: 100 900; src: url(../fonts/Inter-VF.ttf); }
@font-face { font-family: Silkscreen; src: url(../fonts/Silkscreen-Bold.ttf); }
@font-face { font-family: DMSerif; src: url(../fonts/DMSerifDisplay-Regular.ttf); }
@font-face { font-family: DMSerifI; src: url(../fonts/DMSerifDisplay-Italic.ttf); }
@font-face { font-family: RobotoCond; font-weight: 100 900; src: url(../fonts/RobotoCondensed-VF.ttf); }
@font-face { font-family: Arimo; font-weight: 400 700; src: url(../fonts/Arimo-VF.ttf); }
@font-face { font-family: InterTight; font-weight: 100 900; src: url(../fonts/InterTight-VF.ttf); }
@font-face { font-family: Tinos; font-weight: 400; src: url(../fonts/Tinos-Regular.ttf); }
@font-face { font-family: Tinos; font-weight: 700; src: url(../fonts/Tinos-Bold.ttf); }

html,body{margin:0;background:#000} canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="docengine.js"></script><script src="dockit.js"></script><script src="geo_pnw.js"></script><script src="geo_whitechapel.js"></script><script src="geo_world.js"></script>
<script>
const ep = new URLSearchParams(location.search).get('ep');
const EPDIR = `../../documentaries/${ep}/`;
const ASSETS = new URLSearchParams(location.search).get('assets');
const s = document.createElement('script'); s.src = EPDIR + 'scenes.js'; document.body.appendChild(s);
window.READY = (async () => {
  await new Promise(r => s.onload = r);
  const fams = ['60px Bebas', '60px Playfair', '700 60px Playfair', 'italic 60px PlayfairI', '60px SpecialElite', '600 60px Caveat', '500 60px Oswald', '60px CourierPrime', '60px Anton', '60px ArchivoBlack', '800 60px Montserrat', '600 60px Inter', '60px Silkscreen', '60px DMSerif', '60px DMSerifI', '700 60px RobotoCond', '400 60px Arimo', '700 60px InterTight', '400 60px Tinos', '700 60px Tinos', '60px Emoji'];
  await Promise.all(fams.map(f => document.fonts.load(f)));
  const ABASE = (ASSETS ? `../../documentaries/${ASSETS}/` : EPDIR) + 'assets/';
  let imgs = Object.assign({}, EP.images || {});
  try { const lock = await (await fetch(ABASE + 'manifest.lock.json')).json();
    lock.assets.forEach(a => { if (a.status === 'downloaded' && /\.(jpe?g|png|gif|webp)$/i.test(a.file) && !imgs[a.id]) imgs[a.id] = a.file;
      if (a.status === 'downloaded') EP.credit = Object.assign(EP.credit || {}, { [a.id]: [a.attribution, a.license].filter(Boolean).join(' · ') }); });
  } catch (e) { console.warn('no manifest.lock.json'); }
  await loadImages(Object.fromEntries(Object.entries(imgs).map(([k, v]) => [k, ABASE + v])));
  return true;
})();
window.loadTimeline = (tl) => { setTimeline(tl); EP.scenes(); buildShots(); return SHOTS.map(s => [s.start, s.end, s.name || '']); };
window.sfxCues = () => CUES.slice().sort((a, b) => a.t - b.t);
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
window.frameJPEG = (t, q = 0.9) => { renderAt(ctx, t); return document.getElementById('c').toDataURL('image/jpeg', q); };
</script></body></html>
