<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Bebas; src: url(../fonts/BebasNeue-Regular.ttf); }
@font-face { font-family: Playfair; font-weight: 400 900; src: url(../fonts/PlayfairDisplay-VF.ttf); }
@font-face { font-family: PlayfairI; font-weight: 400 900; src: url(../fonts/PlayfairDisplay-Italic-VF.ttf); }
@font-face { font-family: SpecialElite; src: url(../fonts/SpecialElite-Regular.ttf); }
@font-face { font-family: Caveat; font-weight: 400 700; src: url(../fonts/Caveat-VF.ttf); }
@font-face { font-family: Oswald; font-weight: 200 700; src: url(../fonts/Oswald-VF.ttf); }
@font-face { font-family: CourierPrime; src: url(../fonts/CourierPrime-Regular.ttf); }
html,body{margin:0;background:#000} canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="docengine.js"></script><script src="geo_pnw.js"></script>
<script>
const ep = new URLSearchParams(location.search).get('ep');
const EPDIR = `../../documentaries/${ep}/`;
const s = document.createElement('script'); s.src = EPDIR + 'scenes.js'; document.body.appendChild(s);
window.READY = (async () => {
  await new Promise(r => s.onload = r);
  const fams = ['60px Bebas', '60px Playfair', '700 60px Playfair', 'italic 60px PlayfairI', '60px SpecialElite', '600 60px Caveat', '500 60px Oswald', '60px CourierPrime'];
  await Promise.all(fams.map(f => document.fonts.load(f)));
  await loadImages(Object.fromEntries(Object.entries(EP.images).map(([k, v]) => [k, EPDIR + 'assets/' + v])));
  return true;
})();
window.loadTimeline = (tl) => { setTimeline(tl); EP.scenes(); buildShots(); return SHOTS.map(s => [s.start, s.end, s.name || '']); };
window.sfxCues = () => CUES.slice().sort((a, b) => a.t - b.t);
const ctx = document.getElementById('c').getContext('2d');
window.frameJPEG = (t, q = 0.9) => { renderAt(ctx, t); return document.getElementById('c').toDataURL('image/jpeg', q); };
</script></body></html>
