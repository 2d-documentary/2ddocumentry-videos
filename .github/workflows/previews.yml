# Renders still previews of the Three.js locations (1920x1080) and commits them to previews/rome/.
name: Location previews
on:
  push:
    paths: ['film/previews.txt']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { part: [0, 1, 2, 3] }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null
      - run: node characters/sprites.js film/sprites citizen,citizen2,senator,general,romulus,remus,caesar neutral,confused,smug
      - name: Render my share of the previews
        run: |
          mkdir -p previews/rome
          mapfile -t L < <(grep -v '^#' film/previews.txt | grep -v '^$')
          S=(); for i in "${!L[@]}"; do [ $((i % 4)) -eq ${{ matrix.part }} ] && S+=("${L[$i]}"); done
          [ ${#S[@]} -eq 0 ] && exit 0
          node film/stills.mjs previews/rome 1920 1080 "${S[@]}" 2>&1 | grep -v "GPU stall" | tee previews/rome/log_${{ matrix.part }}.txt
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add previews/rome; git commit -qm "Rome location previews [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 7 + 3)); done
