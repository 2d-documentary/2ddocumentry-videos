name: render-doc
# Renders an INK AND ANTIQUITY documentary on GitHub: Kokoro TTS -> SFX cues -> quiet score + mix ->
# 8 parallel frame chunks -> concat -> publish. Triggered by pushing documentaries/<project>/render.json:
#   {"part": "test" | "full", "music_level": 0.20, "crf": 20}
# Output: branch render-<project> (mp4 under 95 MB) and a GitHub release for every render.
on:
  push:
    branches: [main]
    paths: ['documentaries/*/render.json']
  workflow_dispatch:
    inputs:
      project: { description: 'documentaries/<project>', required: true }
permissions:
  contents: write
env:
  CHUNKS: 8
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.p.outputs.project }}
      part: ${{ steps.p.outputs.part }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: p
        run: |
          P="${{ github.event.inputs.project }}"
          [ -n "$P" ] || P=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^documentaries/[^/]+/render\.json$' | cut -d/ -f2 | head -1)
          echo "project=$P" >> $GITHUB_OUTPUT
          echo "part=$(python3 -c "import json;print(json.load(open('documentaries/$P/render.json')).get('part','full'))")" >> $GITHUB_OUTPUT
          echo "project $P"
  audio:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: { P: "${{ needs.setup.outputs.project }}", PART: "${{ needs.setup.outputs.part }}", PYTHONUNBUFFERED: '1' }
    steps:
      - uses: actions/checkout@v4
      - name: Assets
        run: git clone -q --depth 1 -b assets-$P https://github.com/${{ github.repository }} documentaries/$P/assets || echo "no assets branch yet"
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install Kokoro-82M (free TTS), Playwright, ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q "kokoro>=0.9.4" soundfile scipy numpy playwright
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          test -x /usr/bin/google-chrome || (python -m playwright install --with-deps chromium && sudo ln -sf $(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1) /usr/bin/google-chrome)
      - name: Narration (Michael)
        run: python doc/tools/tts.py documentaries/$P build/$P $PART
      - name: SFX cues + score + mix
        run: |
          python doc/tools/render.py documentaries/$P build/$P/timeline.json build/$P/x.mp4 --cues-only
          export MUSIC_LEVEL=$(python3 -c "import json;print(json.load(open('documentaries/$P/render.json')).get('music_level',0.2))")
          python doc/tools/audio_doc.py documentaries/$P build/$P
          ffmpeg -y -v error -i build/$P/mix_raw.wav -af loudnorm=I=-15:TP=-1.5:LRA=11 -ar 48000 -c:a aac -b:a 192k build/$P/mix.m4a
      - uses: actions/upload-artifact@v4
        with: { name: audio, path: "build/${{ needs.setup.outputs.project }}/timeline.json\nbuild/${{ needs.setup.outputs.project }}/mix.m4a\nbuild/${{ needs.setup.outputs.project }}/cues.json" }
  frames:
    needs: [setup, audio]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { chunk: [0, 1, 2, 3, 4, 5, 6, 7] }
    env: { P: "${{ needs.setup.outputs.project }}", PYTHONUNBUFFERED: '1' }
    steps:
      - uses: actions/checkout@v4
      - name: Assets
        run: git clone -q --depth 1 -b assets-$P https://github.com/${{ github.repository }} documentaries/$P/assets || echo "no assets branch yet"
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/download-artifact@v4
        with: { name: audio, path: build/audio }
      - name: Install Playwright + ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright
          test -x /usr/bin/google-chrome || (python -m playwright install --with-deps chromium && sudo ln -sf $(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1) /usr/bin/google-chrome)
      - name: Render chunk ${{ matrix.chunk }}
        run: |
          TL=$(find build/audio -name timeline.json | head -1)
          CRF=$(python3 -c "import json;print(json.load(open('documentaries/$P/render.json')).get('crf',20))")
          N=$(python -c "import json;print(int(json.load(open('$TL'))['duration']*30))")
          A=$(( N * ${{ matrix.chunk }} / CHUNKS )); B=$(( N * (${{ matrix.chunk }} + 1) / CHUNKS ))
          echo "frames $A..$B of $N"
          python doc/tools/render.py documentaries/$P "$TL" build/chunk_${{ matrix.chunk }}.mp4 --from-frame $A --to-frame $B --crf $CRF
      - uses: actions/upload-artifact@v4
        with: { name: "chunk-${{ matrix.chunk }}", path: "build/chunk_${{ matrix.chunk }}.mp4" }
  publish:
    needs: [setup, frames]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { P: "${{ needs.setup.outputs.project }}", PART: "${{ needs.setup.outputs.part }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: build/dl }
      - name: Concat chunks + mux audio
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          for i in $(seq 0 $((CHUNKS-1))); do echo "file '$PWD/build/dl/chunk-$i/chunk_$i.mp4'"; done > build/list.txt
          M=$(find build/dl/audio -name mix.m4a | head -1)
          ffmpeg -y -v error -f concat -safe 0 -i build/list.txt -i "$M" -map 0:v -map 1:a -c:v copy -c:a copy -shortest -movflags +faststart build/$P-$PART.mp4
          ls -lh build/$P-$PART.mp4
      - name: Publish (release + render branch)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          TAG=$P-$PART-$(date +%Y%m%d-%H%M)
          gh release create "$TAG" build/$P-$PART.mp4 --title "$P ($PART) $TAG" --notes "INK AND ANTIQUITY render, run ${{ github.run_id }}, commit ${{ github.sha }}." --target ${{ github.sha }}
          mkdir -p /tmp/r && cd /tmp/r && git init -q -b render-$P
          SZ=$(stat -c %s $GITHUB_WORKSPACE/build/$P-$PART.mp4)
          if [ $SZ -lt 95000000 ]; then cp $GITHUB_WORKSPACE/build/$P-$PART.mp4 .; else
            ffmpeg -y -v error -i $GITHUB_WORKSPACE/build/$P-$PART.mp4 -vf scale=1280:-2 -c:v libx264 -preset veryfast -crf 28 -c:a copy -movflags +faststart $P-$PART-720p.mp4; fi
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/$P-$PART.mp4" > LATEST.txt
          git add -A && git -c user.name=render-bot -c user.email=render-bot@users.noreply.github.com commit -qm "render $TAG"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" render-$P
