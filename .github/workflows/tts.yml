# Free narration with Kokoro TTS (narrator: am_michael). Commits mp3 lines + timing to the branch.
name: TTS
on:
  push:
    paths: ['rome/script.json', 'tools/tts_kokoro.py']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
      - run: pip install -q "kokoro>=0.9.4" soundfile
      - run: python tools/tts_kokoro.py rome/script.json rome/audio
      - run: |
          cd rome/audio && for f in *.wav; do ffmpeg -loglevel error -y -i "$f" -c:a libmp3lame -b:a 128k "${f%.wav}.mp3" && rm "$f"; done
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add rome/audio; git commit -qm "Rome narration (Kokoro TTS) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
