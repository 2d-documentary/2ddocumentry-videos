name: voice-clone-test
# Trigger: push voices/<name>/test.json
# One parallel job per variant: Chatterbox Multilingual (MIT, zero-shot) on CPU, best-of-N takes scored by Whisper.
# Publishes mp3s + reports in a release "<name>-voice-<timestamp>".
on:
  push:
    branches: [main]
    paths: ['voices/*/test.json']

permissions:
  contents: write

concurrency:
  group: voice-clone
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      file: ${{ steps.v.outputs.file }}
      name: ${{ steps.v.outputs.name }}
      variants: ${{ steps.v.outputs.variants }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: v
        run: |
          F=$(git diff --name-only HEAD~1 HEAD -- 'voices/*/test.json' | head -1)
          [ -z "$F" ] && F=$(ls voices/*/test.json | head -1)
          echo "file=$F" >> $GITHUB_OUTPUT
          echo "name=$(basename $(dirname $F))" >> $GITHUB_OUTPUT
          echo "variants=$(python3 -c "import json;print(json.dumps([v['name'] for v in json.load(open('$F'))['variants']]))")" >> $GITHUB_OUTPUT

  clone:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.plan.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-mtl-v3-whisper-turbo
      - name: Install (CPU torch + chatterbox master + faster-whisper)
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "git+https://github.com/resemble-ai/chatterbox.git" soundfile faster-whisper
      - name: Synthesize
        run: python doc/tools/voice_clone.py "${{ needs.plan.outputs.file }}" out "${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.variant }}
          path: out/

  publish:
    needs: [plan, clone]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          cd out
          for f in *.wav; do ffmpeg -hide_banner -loglevel error -y -i "$f" -af loudnorm=I=-16:TP=-1.5 -b:a 160k "${f%.wav}.mp3"; done
          TAG="${{ needs.plan.outputs.name }}-voice-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" *.mp3 report_*.json -R "${{ github.repository }}" --title "Voice clone test ${{ needs.plan.outputs.name }} $TAG" \
            --notes "Chatterbox Multilingual zero-shot, best-of-N with Whisper check, run ${{ github.run_id }}." --target ${{ github.sha }}
