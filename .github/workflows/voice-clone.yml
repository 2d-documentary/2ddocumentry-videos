name: voice-clone-test
# Trigger: push voices/<name>/test.json
# Runs Chatterbox Multilingual (MIT, zero-shot) on CPU with the reference clips in voices/<name>/,
# publishes the variants as mp3 in a release "<name>-voice-<timestamp>".
on:
  push:
    branches: [main]
    paths: ['voices/*/test.json']

permissions:
  contents: write

concurrency:
  group: voice-clone
  cancel-in-progress: false

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Which voice
        id: v
        run: |
          F=$(git diff --name-only HEAD~1 HEAD -- 'voices/*/test.json' | head -1)
          [ -z "$F" ] && F=$(ls voices/*/test.json | head -1)
          echo "file=$F" >> $GITHUB_OUTPUT
          echo "name=$(basename $(dirname $F))" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-mtl-v1
      - name: Install (CPU torch + chatterbox)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts soundfile
      - name: Synthesize
        run: python doc/tools/voice_clone.py "${{ steps.v.outputs.file }}" out
      - name: Publish
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cd out
          for f in *.wav; do ffmpeg -hide_banner -loglevel error -y -i "$f" -af loudnorm=I=-16:TP=-1.5 -b:a 160k "${f%.wav}.mp3"; done
          TAG="${{ steps.v.outputs.name }}-voice-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" *.mp3 timing.json --title "Voice clone test ${{ steps.v.outputs.name }} $TAG" \
            --notes "Chatterbox Multilingual zero-shot, run ${{ github.run_id }}." --target ${{ github.sha }}
