name: tts-test
on:
  push:
    paths: ["tests/tts/*.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts "kokoro>=0.9.4" soundfile numpy
      - name: Generate
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: |
          for f in tests/tts/*.json; do n=$(basename $f .json); python tools/tts_test.py $f out/$n || true; done
          for w in out/*/*.wav; do ffmpeg -v error -y -i "$w" -af loudnorm=I=-16:TP=-1.5 -b:a 192k "${w%.wav}.mp3"; done
          ls -la out/*
      - name: Publish
        run: |
          git config user.name "tts-bot"; git config user.email "tts-bot@users.noreply.github.com"
          git checkout --orphan tts-test && git rm -rq --cached . && mkdir -p pub && cp -r out/* pub/ && find pub -name "*.wav" ! -name "ref_*.wav" -delete
          git add pub && git commit -qm "tts test samples" && git push -f origin HEAD:tts-test
