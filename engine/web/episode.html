<!doctype html>
<html><head><meta charset="utf-8">
<style>@font-face { font-family: Poppins; font-weight: 700; src: url(fonts/Poppins-Bold.ttf); } html,body{margin:0;background:#000} canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="core.js"></script><script src="chars.js"></script><script src="world.js"></script><script src="paint.js"></script><script src="stage3d.js"></script>
<script src="egypt_sets.js"></script><script src="egypt_sets2.js"></script><script src="episode16.js"></script>
<script>
const ep = new URLSearchParams(location.search).get('ep');
const s = document.createElement('script'); s.src = `../../episodes/${ep}/scene.js`; document.body.appendChild(s);
let SHOTS = null;
window.READY = (async () => { await new Promise(r => s.onload = r); await loadEgypt(); await document.fonts.load('700 60px Poppins'); return true; })();
window.loadTimeline = (tl) => {
  setTimeline(tl); SHOTS = EP.shots();
  SHOTS.forEach(sh => sh.start = wt(sh.from[0], sh.from[1]) - (sh.lead ?? .12));
  SHOTS[0].start = 0;
  SHOTS.forEach((sh, i) => { sh.end = i + 1 < SHOTS.length ? SHOTS[i + 1].start : TL.duration; sh.dur = sh.end - sh.start; });
  return SHOTS.map(s => [s.start, s.end, s.bg]);
};
window.prewarm = (names) => { for (const n of names) { const [b, bl] = n.split('|'); bgCanvas(b, +bl || 0); } return Object.keys(BG).length; };
const ctx = document.getElementById('c').getContext('2d');
window.renderAt = (t) => {
  const sh = SHOTS.find(s => t >= s.start && t < s.end) || SHOTS[SHOTS.length - 1];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1920, 1080);
  ctx.save(); runShot(ctx, sh, t, t - sh.start); ctx.restore();
  grain(ctx, t, .05); vignette(ctx, .18);
  return true;
};
window.frameJPEG = (t, q = 0.9) => { renderAt(t); return document.getElementById('c').toDataURL('image/jpeg', q); };
</script></body></html>
