<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Poppins; font-weight: 700; src: url(fonts/Poppins-Bold.ttf); }
html,body{margin:0;background:#000} canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="core.js"></script><script src="chars.js"></script><script src="world.js"></script>
<script>
const ep = new URLSearchParams(location.search).get('ep');
const s = document.createElement('script'); s.src = `../../episodes/${ep}/scene.js`; document.body.appendChild(s);
let SCRIPT = null, SHOTS = null;
window.READY = (async () => {
  await new Promise(r => s.onload = r);
  SCRIPT = await (await fetch(`../../episodes/${ep}/script.json`)).json();
  await document.fonts.load('700 60px Poppins');
  return true;
})();
window.loadTimeline = (tl) => {
  setTimeline(tl); buildCaptions(SCRIPT);
  SHOTS = EP.shots();
  SHOTS.forEach(sh => sh.start = wt(sh.from[0], sh.from[1]));
  SHOTS.forEach((sh, i) => { sh.end = i + 1 < SHOTS.length ? SHOTS[i + 1].start : TL.duration; sh.dur = sh.end - sh.start; });
  return SHOTS.map(s => [s.start, s.end]);
};
window.sfxCues = () => ({ cues: EP.sfx(), duck: EP.duck ? EP.duck() : [] });
const ctx = document.getElementById('c').getContext('2d');
window.renderAt = (t) => {
  let sh = SHOTS.find(s => t >= s.start && t < s.end) || SHOTS[t < SHOTS[0].start ? 0 : SHOTS.length - 1];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save(); sh.draw(ctx, t, t - sh.start, sh); ctx.restore();
  grain(ctx, t, .08); vignette(ctx, .22);
  drawCaptions(ctx, t);
  return true;
};
window.frameJPEG = (t, q = 0.93) => { renderAt(t); return document.getElementById('c').toDataURL('image/jpeg', q); };
</script></body></html>
