<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Poppins;font-weight:700;src:url(fonts/Poppins-Bold.ttf)}body{margin:0}</style></head>
<body><canvas id="c" width="1920" height="720"></canvas>
<script src="core.js"></script><script src="chars.js"></script><script src="world.js"></script><script src="paint.js"></script><script src="stage3d.js"></script><script src="egypt_sets.js"></script><script src="egypt_sets2.js"></script><script src="egypt_cast.js" onerror="0"></script>
<script>
const q = new URLSearchParams(location.search);
const NAMES = (q.get('sets') || 'giza,construction,luxor,village,nile,mapLabelled').split(',');
window.draw = async () => {
  await loadEgypt(); await document.fonts.load('700 30px Poppins');
  const cv = document.getElementById('c'); cv.height = Math.ceil(NAMES.length / 3) * 360; const out = cv.getContext('2d'); window.FULL = {};
  for (let i = 0; i < NAMES.length; i++) {
    const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; const ctx = c.getContext('2d');
    const [set, extra] = NAMES[i].split('+'); SETS[set](ctx, {});
    if (extra && window.EXTRA && EXTRA[extra]) EXTRA[extra](ctx);
    FULL[NAMES[i]] = c.toDataURL('image/jpeg', .9);
    out.drawImage(c, (i % 3) * 640, Math.floor(i / 3) * 360, 640, 360);
  }
};
window.draw().then(() => { window.DONE = true; }).catch(e => { console.error(e.stack || e); window.DONE = true; });
</script></body></html>
